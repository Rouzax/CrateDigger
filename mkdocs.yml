site_name: CrateDigger
site_url: https://rouzax.github.io/CrateDigger/docs/
repo_url: https://github.com/Rouzax/CrateDigger
repo_name: Rouzax/CrateDigger
edit_uri: edit/main/docs/

# Write build output under build/ (already in .gitignore) instead of the
# default ./site, which holds the hand-authored landing page committed to
# the repo. The CI workflow (.github/workflows/deploy-docs.yml) already
# builds into build/docs; aligning the default keeps a bare `zensical build`
# from overwriting site/index.html, site/style.css, and site/assets/.
site_dir: build/docs

# Built with Zensical, which reads this mkdocs.yml natively. Material for
# MkDocs went into maintenance mode in November 2025; Zensical is the same
# team's successor. Keeping the config in mkdocs.yml rather than the native
# zensical.toml is deliberate: it is what the Zensical project itself does,
# and it keeps the build tool swappable.
theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/icon.png
  palette:
    scheme: slate
    primary: custom
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

# Renders a small icon row in the footer of every page. Icon names resolve
# against the sets Zensical bundles under templates/.icons.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Rouzax/CrateDigger
      name: CrateDigger on GitHub
    - icon: fontawesome/brands/ko-fi
      link: https://ko-fi.com/O0W221GBUG
      name: Support CrateDigger on Ko-fi

markdown_extensions:
  - abbr
  - admonition
  - def_list
  - footnotes
  - toc:
      permalink: true
  - zensical.extensions.glightbox
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: Rouzax
      repo: CrateDigger
  - pymdownx.snippets:
      # Appended to every page so the glossary is defined once. Terms are
      # matched in prose only; occurrences inside code spans are left alone.
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Commands:
      - Identify: commands/identify.md
      - Organize: commands/organize.md
      - Enrich: commands/enrich.md
      - Audit Logos: commands/audit-logos.md
  - Configuration: configuration.md
  - Places: places.md
  - 1001Tracklists: tracklists.md
  - Tag reference: tag-reference.md
  - Library layout: library-layout.md
  - Kodi Integration: kodi-integration.md
  - FAQ: faq.md
